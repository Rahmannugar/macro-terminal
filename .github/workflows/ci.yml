name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Provide local environment file
        run: cp .env.example .env
      - name: Install pinned golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(tr -d '[:space:]' < .golangci-lint-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate contract and database code
        run: task generate
      - name: Fail on generated drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Build
        run: go build ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Provide local environment file
        run: cp .env.example .env
      - name: Integration tests
        run: task test-integration

  deploy:
    runs-on: ubuntu-latest
    needs: [go, client, integration]
    if: github.event_name == 'push'
    steps:
      - name: Deploy to the production server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY" | ssh-add -
          ssh-keyscan -H 169.58.72.130 >> ~/.ssh/known_hosts
          ssh root@169.58.72.130 'bash /opt/macro-terminal/deploy/deploy.sh'
