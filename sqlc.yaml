version: "2"
sql:
  - name: users
    engine: postgresql
    schema: db/migrations
    queries: server/internal/users/queries
    gen:
      go:
        package: userdb
        out: server/internal/users/repositories/generated
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
