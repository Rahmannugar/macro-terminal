services:
  mt4:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-relay:14318
  mt5:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-relay:14318
  otel-relay:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      MACRO_TERMINAL_CONNECTIVITY_OTLP_BIND: 0.0.0.0:14318
      MACRO_TERMINAL_CONNECTIVITY_OTLP_UPSTREAM: http://otel-collector:4318
    networks:
      - mt4
      - mt5
      - collector
    sysctls:
      net.ipv4.ip_forward: "0"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
    configs:
      - source: connectivity-otel-relay
        target: /etc/otelcol/config.yaml

configs:
  connectivity-otel-relay:
    file: otel-relay.yml

networks:
  collector:
    external: true
    name: macro-terminal-prod_default
